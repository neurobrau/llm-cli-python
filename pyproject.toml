[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobrau-llm-cli"
version = "0.1.0"
description = "Multi-provider LLM command-line client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[project.scripts]
neurobrau = "neurobrau_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
