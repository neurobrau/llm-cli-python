[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobrau-llm-cli"
dynamic = ["version"]  # single source: neurobrau_cli.__version__
description = "Multi-provider LLM command-line client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.36,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[project.scripts]
neurobrau = "neurobrau_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "neurobrau_cli.__version__"}
